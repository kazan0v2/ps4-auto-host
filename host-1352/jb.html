<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KAZANOVA PS4 HOST</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  
<style id="kazanova-premium-theme">
html,body{min-height:100%;margin:0!important;padding:0!important;background:#070b10 url("kazanova-bg.jpg") center center/cover no-repeat!important;color:#f4eee7!important;font-family:Arial,"Segoe UI",sans-serif!important;}
body{display:block!important;text-align:center!important;overflow-x:hidden!important;}
.kz-brand{height:68px;box-sizing:border-box;display:flex!important;align-items:center;justify-content:center;padding:8px 14px;background:rgba(8,12,17,.94);border-bottom:1px solid #b8753f;}
.kz-brand img{width:48px!important;height:48px!important;object-fit:cover!important;border-radius:50%!important;border:1px solid #c98a55!important;margin:0 12px 0 0!important;}
.kz-brand .kz-title{font-size:21px;font-weight:bold;letter-spacing:.10em;color:#fff2e5;}
.kz-brand .kz-sub{display:block;font-size:9px;letter-spacing:.16em;color:#d9a06d;margin-top:3px;font-weight:bold;}
.kz-shell,#wrap{width:86%!important;max-width:820px!important;margin:7vh auto 0!important;padding:24px!important;box-sizing:border-box!important;background:rgba(5,9,13,.86)!important;border:1px solid #9f6538!important;border-radius:10px!important;}
h1,h2,#state,#msgs{color:#fff1e2!important;text-shadow:none!important;}
hr{height:1px;border:0!important;background:#9f6538!important;max-width:680px;}
button,#jailbreakBtn,.pro-animated-btn,.btn{background:#a55325!important;color:#fff8f0!important;border:1px solid #d99a62!important;border-radius:8px!important;box-shadow:none!important;padding:12px 26px!important;font-weight:bold!important;cursor:pointer!important;text-shadow:none!important;animation:none!important;transition:none!important;}
button:focus,#jailbreakBtn:focus,.pro-animated-btn:focus,.btn:focus{background:#bd6631!important;outline:1px solid #efbc8b!important;}
button:disabled,#jailbreakBtn:disabled{opacity:.55!important;}
#console,pre{width:86%!important;max-width:820px!important;margin:20px auto!important;box-sizing:border-box!important;background:rgba(3,7,10,.92)!important;border:1px solid #335567!important;border-radius:7px!important;color:#dff4ff!important;box-shadow:none!important;}
#det,#cache{color:#d5dbe1!important;text-shadow:none!important;}
#det b,.ok,.cacheok,.safe{color:#9ce2b7!important;text-shadow:none!important;}.bad,.danger{color:#ff9a8f!important}.warn{color:#f4cb83!important;}
footer{color:#d4ae88!important;text-shadow:none!important;}a{color:#ffc17c!important;text-shadow:none!important;}
#spin{box-shadow:none!important;}#msg{color:#fff4e8!important;text-shadow:none!important;font-weight:bold!important;}
#msgs{display:inline-block;max-width:760px;padding:14px 22px!important;background:rgba(5,9,13,.86);border:1px solid #9f6538;border-radius:9px;box-shadow:none!important;}
@media (max-width:760px){.kz-brand{height:62px}.kz-brand img{width:44px!important;height:44px!important}.kz-brand .kz-title{font-size:17px}.kz-brand .kz-sub{font-size:8px}.kz-shell,#wrap{width:92%!important;padding:18px!important}}
</style>

</head>
  <body>
    <div class="kz-brand"><img src="kazanova-logo.png" alt="KAZANOVA"><div><span class="kz-title">KAZANOVA PS4 HOST</span><span class="kz-sub">PREMIUM AUTO FIRMWARE EXPERIENCE</span></div></div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
