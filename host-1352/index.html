<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAZANOVA PS4 HOST</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>

<style id="kazanova-premium-theme">
html,body{min-height:100%;margin:0!important;padding:0!important;background:#05090e url("kazanova-bg.jpg") center center/cover no-repeat!important;color:#f7f2ea!important;font-family:Arial,"Segoe UI",sans-serif!important;text-align:center!important;}
body{position:relative!important;display:block!important;overflow-x:hidden!important;}
body>*{position:relative;z-index:1;}
.kz-brand{height:84px;box-sizing:border-box;display:flex!important;align-items:center;justify-content:center;gap:15px;padding:10px 22px;background:rgba(8,12,17,.94);border-bottom:1px solid #b97842;}
.kz-brand img{width:60px!important;height:60px!important;object-fit:cover!important;border-radius:50%!important;border:1px solid #d99a63!important;margin:0!important;}
.kz-brand .kz-title{font-size:23px;font-weight:900;letter-spacing:.15em;color:#fff4e8;}
.kz-brand .kz-sub{display:block;font-size:10px;letter-spacing:.24em;color:#efb777;margin-top:4px;font-weight:800;}
.kz-shell,#wrap{width:86%!important;max-width:860px!important;margin:8vh auto 0!important;padding:30px!important;box-sizing:border-box!important;background:rgba(8,13,19,.88)!important;border:1px solid #b97842!important;border-radius:14px!important;}
h1,h2,#state,#msgs{color:#fff5eb!important;}
hr{height:1px;border:0!important;background:#b97842!important;max-width:680px;}
button,#jailbreakBtn,.pro-animated-btn,.btn{background:#a75125!important;color:#fff8f0!important;border:1px solid #e3a56d!important;border-radius:9px!important;padding:13px 30px!important;font-weight:900!important;letter-spacing:.04em!important;cursor:pointer!important;}
button:hover,#jailbreakBtn:hover,.pro-animated-btn:hover,.btn:hover,button:focus,#jailbreakBtn:focus,.btn:focus{background:#bd642f!important;outline:none!important;}
button:disabled,#jailbreakBtn:disabled{opacity:.58!important;}
#console,pre{width:86%!important;max-width:860px!important;margin:24px auto!important;box-sizing:border-box!important;background:rgba(2,7,11,.94)!important;border:1px solid #47788d!important;border-radius:10px!important;color:#dff4ff!important;}
#det,#cache{color:#d5dbe1!important;}
#det b,.ok,.cacheok,.safe{color:#9ce2b7!important;}
.bad,.danger{color:#ff9a8f!important}.warn{color:#f4cb83!important;}
footer{color:#e9c39b!important;}
a{color:#ffc17c!important;}
#spin{border-color:rgba(238,181,124,.22)!important;border-top-color:#ffc078!important;}
#msg{color:#fff4e8!important;font-weight:800!important;}
#msgs{display:inline-block;max-width:780px;padding:18px 28px!important;background:rgba(8,13,19,.88);border:1px solid #b97842;border-radius:12px;}
@media (max-width:760px){.kz-brand{height:76px}.kz-brand img{width:50px!important;height:50px!important}.kz-brand .kz-title{font-size:18px}.kz-brand .kz-sub{font-size:8px}.kz-shell,#wrap{width:92%!important;padding:22px!important}button,#jailbreakBtn,.pro-animated-btn,.btn{max-width:88%!important}}
</style>

</head>
<body>
<div class="kz-brand"><img src="kazanova-logo.png" alt="KAZANOVA"><div><span class="kz-title">KAZANOVA PS4 HOST</span><span class="kz-sub">PREMIUM AUTO FIRMWARE EXPERIENCE</span></div></div>
<div id="wrap">
  <div id="state">Detecting PS4 firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("Loading compatible jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
